---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leftover-test1
  namespace: pets
  labels: { app: leftover-test1, role: leftover-idle }
spec:
  replicas: 1
  selector: { matchLabels: { app: leftover-test1 } }
  template:
    metadata:
      labels: { app: leftover-test1, role: leftover-idle }
    spec:
      containers:
        - name: stress
          image: alexeiled/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "65"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
